<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>面试话术弹药库</title>
<style>
:root {
  --bg: #F2F2F7;
  --bg2: #FFFFFF;
  --bg3: #E5E5EA;
  --card-bg: rgba(255,255,255,0.85);
  --card-border: rgba(60,60,67,0.08);
  --card-shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
  --card-shadow-hover: 0 4px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  --frosted: rgba(255,255,255,0.72);
  --frosted-border: rgba(60,60,67,0.12);
  --text: #000000;
  --text2: #3C3C43;
  --text3: #8E8E93;
  --separator: #C6C6C8;
  --fill: rgba(60,60,67,0.06);
  --fill2: rgba(60,60,67,0.12);
  --blue: #007AFF;
  --blue-bg: rgba(0,122,255,0.08);
  --green: #34C759;
  --green-bg: rgba(52,199,89,0.08);
  --orange: #FF9500;
  --orange-bg: rgba(255,149,0,0.08);
  --red: #FF3B30;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --sidebar-w: 260px;
  --font: "OPPOSans", "OPPOSans R", "Microsoft YaHei UI", "PingFang SC", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1C1C1E;
    --bg2: #2C2C2E;
    --bg3: #3A3A3C;
    --card-bg: rgba(44,44,46,0.9);
    --card-border: rgba(255,255,255,0.08);
    --card-shadow: 0 2px 12px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.15);
    --card-shadow-hover: 0 4px 24px rgba(0,0,0,0.4);
    --frosted: rgba(44,44,46,0.78);
    --frosted-border: rgba(255,255,255,0.1);
    --text: #FFFFFF;
    --text2: #EBEBF5;
    --text3: #8E8E93;
    --separator: #38383A;
    --fill: rgba(255,255,255,0.06);
    --fill2: rgba(255,255,255,0.12);
    --blue: #0A84FF;
    --blue-bg: rgba(10,132,255,0.1);
    --green: #30D158;
    --green-bg: rgba(48,209,88,0.1);
    --orange: #FF9F0A;
    --orange-bg: rgba(255,159,10,0.1);
    --red: #FF453A;
  }
}

* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.47;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* top bar - ios nav style */
.topbar {
  height: 48px;
  border-bottom: 0.5px solid var(--separator);
  display:flex; align-items:center; padding:0 16px; gap:10px;
  flex-shrink:0;
  background: var(--frosted);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  backdrop-filter: blur(20px) saturate(1.4);
  user-select:none;
}
.topbar-logo {
  font-family: "OPPOSans", -apple-system, sans-serif;
  font-size: 20px; font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--text);
}
.topbar-logo span { color: var(--text3); font-weight:400; font-size:15px; }
.topbar-tag {
  font-size:12px; color:var(--text3);
  padding:3px 10px;
  background: var(--fill);
  border-radius: var(--radius-sm);
  letter-spacing: 0.2px;
}
.topbar-menu {
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm); cursor:pointer; color:var(--blue);
  font-size:18px; flex-shrink:0;
  transition: background 0.2s cubic-bezier(0.25,0.1,0.25,1);
}
.topbar-menu:hover { background:var(--fill); }
.topbar-stats { margin-left:auto; display:flex; gap:18px; font-size:13px; color:var(--text3); }
.topbar-stats span { color:var(--text); font-weight:600; }

/* sidebar - grouped list style */
.layout { display:flex; flex:1; overflow:hidden; }
.sidebar {
  width: var(--sidebar-w); flex-shrink:0;
  border-right: 0.5px solid var(--separator);
  background: var(--bg2);
  display:flex; flex-direction:column; overflow:hidden;
  transition: width 0.35s cubic-bezier(0.25,0.1,0.25,1), opacity 0.35s;
}
.sidebar.collapsed { width:0; opacity:0; border-right:none; }
.sidebar-scroll { flex:1; overflow-y:auto; padding:8px 0; }
.sidebar-group { margin-bottom:4px; }
.sidebar-group-title {
  font-size: 13px; color: var(--text3); text-transform: uppercase;
  letter-spacing: 0.5px; padding: 8px 20px 4px; font-weight: 600;
}
.sidebar-item {
  display:flex; align-items:center; gap:10px;
  padding: 8px 20px; margin: 0 6px;
  cursor:pointer; font-size: 15px; color: var(--text);
  border-radius: var(--radius-sm); position:relative;
  transition: background 0.2s cubic-bezier(0.25,0.1,0.25,1);
}
.sidebar-item:hover { background: var(--fill); }
.sidebar-item.active { background: var(--blue-bg); color: var(--blue); }
.sidebar-item .si-icon { width:22px; text-align:center; font-size:15px; color:var(--text3); flex-shrink:0; }
.sidebar-item.active .si-icon { color:var(--blue); }
.sidebar-item .si-badge {
  margin-left:auto; font-size:12px; color:var(--text3);
  background: var(--fill); padding:1px 8px; border-radius:10px; height:20px; line-height:18px;
}
.sidebar-item .si-dots {
  visibility:hidden; margin-left:4px; font-size:14px; color:var(--text3);
  padding:2px 4px; border-radius:4px;
}
.sidebar-item:hover .si-dots { visibility:visible; }
.sidebar-item .si-dots:hover { background:var(--fill2); color:var(--text); }
.sidebar-divider { height:0.5px; background:var(--separator); margin:8px 20px; }
.add-module-btn { font-size:13px; color:var(--blue); cursor:pointer; padding:0 4px; font-weight:600; }
.add-module-btn:hover { opacity:0.8; }

/* main content */
.main { flex:1; padding: 20px 28px; overflow-y:auto; }
.page-header { margin-bottom: 20px; display:flex; align-items:center; justify-content:space-between; }
.page-header-left h2 {
  font-family: "OPPOSans", -apple-system, sans-serif;
  font-size: 28px; font-weight: 600;
  letter-spacing: 0.3px; margin-bottom:2px;
  color: var(--text);
}
.page-header-left p { font-size: 15px; color: var(--text3); }
.page-header-actions { display:flex; gap:8px; }

/* buttons - ios style */
.btn-text {
  padding:6px 16px; border:none; border-radius: var(--radius-sm);
  background: var(--blue-bg); color: var(--blue);
  cursor:pointer; font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:4px;
  transition: background 0.2s, opacity 0.2s;
}
.btn-text:hover { background: rgba(0,122,255,0.12); }
.btn-primary {
  padding:6px 18px; border:none; border-radius: var(--radius-sm);
  background: var(--blue); color: #FFFFFF;
  cursor:pointer; font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:4px;
  transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-icon {
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  border:none; border-radius: var(--radius-sm);
  background: var(--fill); cursor:pointer; color: var(--text2); font-size:15px;
  transition: background 0.2s;
}
.btn-icon:hover { background: var(--fill2); }

/* cards - ios list style */
.card-grid { display:flex; flex-direction:column; gap:0; }
.card {
  background: var(--card-bg);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 0.5px solid var(--card-border);
  padding: 14px 18px;
  cursor:pointer;
  transition: box-shadow 0.3s cubic-bezier(0.25,0.1,0.25,1), transform 0.2s;
  position:relative;
}
.card:first-child { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.card:last-child { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.card:only-child { border-radius: var(--radius-lg); }
.card + .card { border-top: none; }
.card:hover { 
  box-shadow: var(--card-shadow-hover);
  z-index: 2;
  transform: translateY(-1px);
}
.card.draghandle::before {
  content:""; position:absolute; left:0; top:0; bottom:0; width:20px;
  background: linear-gradient(90deg, var(--fill) 0%, transparent 100%);
  opacity:0; border-radius: 16px 0 0 16px;
  transition: opacity 0.2s;
}
.card.draghandle:hover::before { opacity:0.5; }
.card-actions {
  position:absolute; top:12px; right:12px;
  display:flex; gap:6px; opacity:0;
  transition: opacity 0.2s;
}
.card:hover .card-actions { opacity:1; }
.card-act {
  width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  border:none; border-radius: 6px;
  background: var(--fill); cursor:pointer; font-size:13px; color:var(--text2);
  transition: background 0.15s;
}
.card-act:hover { background: var(--fill2); color: var(--text); }
.card-act.del:hover { color: var(--red); background: var(--red); color:#fff; }
.card-header { display:flex; align-items:flex-start; gap:10px; }
.card-status {
  flex-shrink:0; width:8px; height:8px; border-radius:4px;
  margin-top:5px;
}
.card-status.polished { background: var(--green); }
.card-status.draft { background: var(--orange); }
.card-title { font-weight: 500; font-size: 17px; color: var(--text); margin-bottom:2px; letter-spacing:-0.2px; }
.card-subtitle { font-size: 13px; color: var(--text3); }
.card-tags { display:flex; gap:4px; flex-wrap:wrap; margin:6px 0 0; }
.card-tag {
  font-size: 12px; padding: 2px 8px; border-radius: 4px;
  color: var(--text3); background: var(--fill);
  font-weight: 400;
}
.card-tag.scene { background: var(--blue-bg); color: var(--blue); }
.card-tag.data { background: var(--green-bg); color: var(--green); }
.card-detail { display:none; margin-top:10px; padding-top:10px; border-top:0.5px solid var(--separator); font-size:15px; line-height:1.6; color: var(--text2); }
.card.expanded { box-shadow: var(--card-shadow); }
.card.expanded .card-detail { display:block; }
.card-detail .label {
  font-size: 12px; color: var(--text3); font-weight: 600;
  margin-bottom:4px; margin-top:10px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.card-detail .label:first-child { margin-top:0; }
.card-detail .quote {
  background: var(--fill); padding: 10px 14px; border-radius: var(--radius-sm);
  margin:4px 0; font-size:15px; line-height:1.6; color: var(--text2);
}
.key { color: var(--blue); font-weight:500; }

/* resume */
.resume-section { display:flex; flex-direction:column; align-items:center; gap:16px; padding:40px 0; }
.resume-preview {
  width:100%; max-width:520px;
  background: var(--card-bg);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 0.5px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  box-shadow: var(--card-shadow);
  font-size: 15px; line-height:1.6; color: var(--text2);
}

/* forms - ios style */
.company-form {
  background: var(--card-bg);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 0.5px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: var(--card-shadow);
}
.company-form .form-row { display:flex; gap:8px; margin-bottom:10px; }
.company-form .form-row:last-child { margin-bottom:0; }
.company-form input, .company-form textarea {
  background: var(--fill);
  border: 0.5px solid var(--card-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px; color: var(--text);
  font-size: 15px; width:100%; outline:none;
  font-family: var(--font);
  transition: border-color 0.2s;
}
.company-form textarea { min-height:60px; resize:vertical; }
.company-form input:focus, .company-form textarea:focus {
  border-color: var(--blue);
}
.company-form .btn {
  padding:6px 14px; border:none; border-radius: var(--radius-sm);
  background: var(--fill); color: var(--blue); cursor:pointer;
  font-size:13px; font-weight:500; white-space:nowrap;
  transition: background 0.2s;
}
.company-form .btn:hover { background: var(--fill2); }

.history-list { display:flex; flex-direction:column; gap:0; }
.history-item {
  background: var(--card-bg);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 0.5px solid var(--card-border);
  padding: 12px 16px; display:flex; justify-content:space-between; align-items:center;
  cursor:pointer;
}
.history-item:first-child { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.history-item:last-child { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.history-item + .history-item { border-top: none; }
.history-item:hover { background: var(--fill); }
.history-item .h-name { font-weight:500; font-size:15px; }
.history-item .h-meta { font-size:13px; color:var(--text3); }

/* modal - ios sheet style */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background: rgba(0,0,0,0.3);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  z-index:100; align-items:center; justify-content:center;
}
.modal-overlay.show { display:flex; }
.modal {
  background: var(--card-bg);
  -webkit-backdrop-filter: blur(30px) saturate(1.4);
  backdrop-filter: blur(30px) saturate(1.4);
  border: 0.5px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  width: 520px; max-width:92vw; max-height:80vh; overflow-y:auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.modal h3 {
  font-family: "OPPOSans", -apple-system, sans-serif;
  font-size: 20px; font-weight: 600; margin-bottom: 16px;
}
.modal .field { margin-bottom: 12px; }
.modal .field label {
  display:block; font-size:13px; color:var(--text3); font-weight:600;
  margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;
}
.modal .field input, .modal .field select, .modal .field textarea {
  width:100%; padding:8px 12px;
  border: 0.5px solid var(--card-border);
  border-radius: var(--radius-sm); font-size:15px;
  background: var(--fill); color:var(--text); outline:none;
  font-family: var(--font);
  transition: border-color 0.2s;
}
.modal .field textarea { min-height:50px; resize:vertical; }
.modal .field input:focus, .modal .field textarea:focus {
  border-color: var(--blue);
}
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal-actions .btn {
  padding:8px 20px; border:none; border-radius: var(--radius-sm);
  background: var(--fill); cursor:pointer; font-size:15px; color: var(--blue);
  font-weight:500; transition: background 0.2s;
}
.modal-actions .btn:hover { background: var(--fill2); }
.modal-actions .btn.primary {
  background: var(--blue); color: #FFFFFF;
}
.modal-actions .btn.primary:hover { opacity: 0.85; }
.modal-actions .btn.danger { color: var(--red); background: transparent; }
.modal-actions .btn.danger:hover { background: var(--red); color:#fff; }

.section-item { display:flex; gap:6px; margin-bottom:8px; align-items:flex-start; }
.section-item input { flex:1; }
.section-item textarea { flex:2; min-height:36px; }
.section-item .rm { color: var(--red); cursor:pointer; font-size:18px; padding:6px; }

.search-empty { text-align:center; padding:40px 0; color:var(--text3); font-size:15px; }

/* scrollbar */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:var(--text3); border-radius:2px; }
::-webkit-scrollbar-track { background:transparent; }

/* login overlay */
.login-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
}
.login-overlay.show { display: flex; }
.login-card {
  background: var(--card-bg);
  -webkit-backdrop-filter: blur(30px) saturate(1.4);
  backdrop-filter: blur(30px) saturate(1.4);
  border: 0.5px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 32px 36px;
  width: 320px; max-width: 90vw;
  box-shadow: var(--card-shadow);
  text-align: center;
}
.login-card h1 {
  font-size: 20px; font-weight: 700; margin-bottom: 6px;
  font-family: "OPPOSans", -apple-system, sans-serif;
}
.login-card p { font-size: 13px; color: var(--text3); margin-bottom: 20px; }
.login-card input {
  width: 100%; padding: 10px 14px;
  border: 0.5px solid var(--card-border);
  border-radius: var(--radius-sm);
  font-size: 15px; background: var(--fill); color: var(--text);

}
.login-card input:focus { border-color: var(--blue); }
.login-card .btn-primary { width: 100%; justify-content: center; padding: 10px 0; font-size: 15px; }
.login-error { font-size: 12px; color: var(--red); margin-bottom: 10px; min-height: 16px; }

</style>
</head>

<script>

const API = "/api";

let authToken = localStorage.getItem("wb_token") || "";
const originalFetch = window.fetch;
window.fetch = function(url, options) {
  options = options || {};
  const headers = new Headers(options.headers || {});
  if (authToken) headers.set("Authorization", "Bearer " + authToken);
  options.headers = headers;
  return originalFetch(url, options);
};
function showLogin() {
  document.getElementById("loginOverlay").classList.add("show");
}
function hideLogin() {
  document.getElementById("loginOverlay").classList.remove("show");
}
async function doLogin() {
  const pass = document.getElementById("loginPass").value;
  document.getElementById("loginError").textContent = "";
  try {
    const r = await originalFetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pass })
    });
    if (r.ok) {
      const d = await r.json();
      authToken = d.token;
      localStorage.setItem("wb_token", d.token);
      hideLogin();
      if (authToken) {
  loadAll().catch(function() { showLogin(); });
} else {
  showLogin();
}
    } else {
      document.getElementById("loginError").textContent = "密码错误，请重试";
    }
  } catch(e) {
    document.getElementById("loginError").textContent = "登录失败，请稍后再试";
  }
}
function handle401(resp) {
  if (resp.status === 401) { showLogin(); return true; }
  return false;
}

    {"id":"qa","title":"问答弹药","description":"按题型组织的高频问答","icon":"💬","order":3},
    {"id":"phrase","title":"常用话术","description":"跨模块通用的骨架句","icon":"📝","order":4},

    {"id":"company","title":"公司准备","description":"面试前调研与弹药组合","icon":"🏢","order":6}

async function restoreFromBackup() {
  await fetch(API + "/data/restore", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(BACKUP) });
}

async function loadAll() {
  let m;
  try {
    const resp = await fetch(API + "/modules");
    if (handle401(resp)) return;
    m = await resp.json();
  }
  catch(e) { m = []; }
  if (!m || m.length === 0) {
    await restoreFromBackup();
    m = await fetch(API + "/modules").then(function(r) { return r.json(); });
  }
  modules = m;
  var allCards = [];
  for (var i = 0; i < modules.length; i++) {
    var c = await fetch(API + "/modules/" + modules[i].id + "/cards").then(function(r) { return r.json(); });
    allCards = allCards.concat(c);
  }
  cards = allCards;
  renderSidebar();
  if (!currentModuleId && modules.length) { currentModuleId = modules[0].id; }
  renderPage(currentModuleId);
  updateStats();
}

function renderSidebar() {
  var h = [];
  h.push("<div class=\"sidebar-group\"><div class=\"sidebar-group-title\">模块 <span class=\"add-module-btn\" onclick=\"addModule()\">+</span></div>");
  for (var i = 0; i < modules.length; i++) {
    var m = modules[i];
    var cls = m.id === currentModuleId ? "sidebar-item active" : "sidebar-item";
    var count = 0;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].moduleId === m.id) count++;
    }
    var icon = m.icon || "📄";
    h.push("<div class=\"" + cls + "\" data-id=\"" + m.id + "\"><span class=\"si-icon\">" + icon + "</span><span>" + m.title + "</span><span class=\"si-badge\">" + count + "</span><span class=\"si-dots\" onclick=\"event.stopPropagation();editModule(\'" + m.id + "\')\">✎</span></div>");
  }
  h.push("</div>");
  document.getElementById("sidebarContent").innerHTML = h.join("");
  var items = document.querySelectorAll(".sidebar-item");
  for (var i = 0; i < items.length; i++) {
    items[i].addEventListener("click", function() {
      currentModuleId = this.getAttribute("data-id");
      renderSidebar();
      renderPage(currentModuleId);
    });
  }
}

function renderCard(c) {
  var tags = "";
  for (var i = 0; i < (c.scenes || []).length; i++) {
    tags += "<span class=\"card-tag scene\">" + c.scenes[i] + "</span>";
  }
  for (var i = 0; i < (c.dataTags || []).length; i++) {
    tags += "<span class=\"card-tag data\">" + c.dataTags[i] + "</span>";
  }
  var detail = "";
  for (var i = 0; i < (c.sections || []).length; i++) {
    detail += "<div class=\"label\">" + c.sections[i].label + "</div><div class=\"quote\">" + c.sections[i].quote + "</div>";
  }
  return "<div class=\"card draghandle\" data-id=\"" + c.id + "\" onclick=\"toggleCard(this)\"><div class=\"card-actions\"><div class=\"card-act\" onclick=\"event.stopPropagation();editCard(\'" + c.id + "\')\">✎</div><div class=\"card-act del\" onclick=\"event.stopPropagation();deleteCard(\'" + c.id + "\')\">✕</div></div><div class=\"card-header\"><div class=\"card-status " + c.status + "\"></div><div><div class=\"card-title\">" + c.title + "</div><div class=\"card-subtitle\">" + (c.subtitle || "") + "</div></div></div><div class=\"card-tags\">" + tags + "</div><div class=\"card-detail\">" + detail + "</div></div>";
}

async function renderPage(moduleId) {
  var mod = null;
  for (var i = 0; i < modules.length; i++) {
    if (modules[i].id === moduleId) { mod = modules[i]; break; }
  }
  if (!mod) {
    document.getElementById("mainContent").innerHTML = "<h2>选择左侧模块</h2>";
    return;
  }
  var mc = [];
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].moduleId === moduleId) mc.push(cards[i]);
  }
  mc.sort(function(a,b) { return a.order - b.order; });
  
  if (moduleId === "resume") {
    var rd = mod.resumeData || {};
    document.getElementById("mainContent").innerHTML =
      "<div class=\"page\"><div class=\"page-header\"><div class=\"page-header-left\"><h2>个人简历</h2><p>" + (mod.description || "") + "</p></div><div class=\"page-header-actions\"><div class=\"btn-primary\" onclick=\"editResume()\">编辑简历</div></div></div>" +
      "<div class=\"resume-section\"><div class=\"resume-preview\"><div style=\"font-weight:600;font-size:16px;margin-bottom:6px;\">" + (rd.name||"") + "</div>" +
      "<div style=\"margin-bottom:10px;font-size:13px;\">" + (rd.phone||"") + " · " + (rd.email||"") + " · " + (rd.age||"") + " · " + (rd.location||"") + "</div>" +
      "<div style=\"margin-bottom:6px;\"><span style=\"font-weight:500;\">求职意向</span>：" + (rd.intent||"") + "</div>" +
      "<div style=\"margin-bottom:6px;\"><span style=\"font-weight:500;\">教育</span>：" + (rd.education||"") + "</div>" +
      "<div style=\"font-weight:500;margin-top:4px;\">核心竞争力</div><div>" + (rd.core||"") + "</div></div></div></div>";
    return;
  }  
  if (moduleId === "company") {
    document.getElementById("mainContent").innerHTML = "<div class=\"page\"><div class=\"page-header\"><h2>公司准备</h2></div></div>";
    return;
  }
  
  var polished = 0;
  for (var i = 0; i < mc.length; i++) {
    if (mc[i].status === "polished") polished++;
  }
  
  var cardsHtml = "";
  for (var i = 0; i < mc.length; i++) {
    cardsHtml += renderCard(mc[i]);
  }
  if (mc.length === 0) { cardsHtml = "<div class=\"search-empty\">还没有卡片</div>"; }
  
  document.getElementById("mainContent").innerHTML =     "<div class=\"page\"><div class=\"page-header\">" +     "<div class=\"page-header-left\"><h2>" + mod.title + "</h2><p>" + (mod.description || "") + " · " + mc.length + "项 · " + polished + "已打磨</p></div>" +     "<div class=\"page-header-actions\"><div class=\"btn-text\" onclick=\"editModule(\'" + moduleId + "\')\">✎ 编辑模块</div><div class=\"btn-primary\" onclick=\"addCard(\'" + moduleId + "\')\">+ 添加卡片</div></div></div>" +     "<div class=\"card-grid\">" + cardsHtml + "</div></div>";
}

function toggleCard(el) {
  if (event && event.target.closest(".card-actions")) return;
  var was = el.classList.contains("expanded");
  var expanded = document.querySelectorAll(".card.expanded");
  for (var i = 0; i < expanded.length; i++) {
    expanded[i].classList.remove("expanded");
  }
  if (!was) el.classList.add("expanded");
}

function updateStats() {
  var total = cards.length;
  var polished = 0;
  var draft = 0;
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].status === "polished") polished++;
    else draft++;
  }
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statPolished").textContent = polished;
  document.getElementById("statDraft").textContent = draft;
}

async function addModule() {
  var name = prompt("模块名称：");
  if (!name) return;
  var m = await fetch(API + "/modules", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: name, icon: "📄", description: "" }) }).then(function(r) { return r.json(); });
  modules.push(m);
  currentModuleId = m.id;
  renderSidebar();
  renderPage(m.id);
}

function editModule(id) {
  var mod = null;
  for (var i = 0; i < modules.length; i++) {
    if (modules[i].id === id) { mod = modules[i]; break; }
  }
  if (!mod) return;
  document.getElementById("modalOverlay").classList.add("show");
  document.getElementById("modalContent").innerHTML =     "<h3>编辑模块</h3>" +     "<div class=\"field\"><label>标题</label><input id=\"modTitle\" value=\"" + mod.title + "\"></div>" +     "<div class=\"field\"><label>描述</label><input id=\"modDesc\" value=\"" + (mod.description || "") + "\"></div>" +     "<div class=\"field\"><label>图标</label><input id=\"modIcon\" value=\"" + (mod.icon || "📄") + "\" maxlength=\"2\"></div>" +     "<div class=\"modal-actions\"><div class=\"btn\" onclick=\"closeModal()\">取消</div><div class=\"btn danger\" onclick=\"deleteModule(\'" + id + "\')\">删除模块</div><div class=\"btn primary\" onclick=\"saveModule(\'" + id + "\')\">保存</div></div>";
}

async function saveModule(id) {
  var title = document.getElementById("modTitle").value.trim();
  if (!title) return;
  var icon = document.getElementById("modIcon").value || "📄";
  var desc = document.getElementById("modDesc").value;
  var updated = await fetch(API + "/modules/" + id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: title, icon: icon, description: desc }) }).then(function(r) { return r.json(); });
  for (var i = 0; i < modules.length; i++) {
    if (modules[i].id === id) { modules[i] = updated; break; }
  }
  closeModal();
  renderSidebar();
  renderPage(id);
}

async function deleteModule(id) {
  if (!confirm("确认删除此模块及其所有卡片？")) return;
  await fetch(API + "/modules/" + id, { method: "DELETE" });
  var newModules = [];
  for (var i = 0; i < modules.length; i++) {
    if (modules[i].id !== id) newModules.push(modules[i]);
  }
  modules = newModules;
  var newCards = [];
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].moduleId !== id) newCards.push(cards[i]);
  }
  cards = newCards;
  closeModal();
  if (currentModuleId === id) {
    currentModuleId = modules.length ? modules[0].id : null;
  }
  renderSidebar();
  renderPage(currentModuleId);
  updateStats();
}

  var c = await fetch(API + "/modules/" + moduleId + "/cards", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: "新卡片", subtitle: "", status: "draft", scenes: [], dataTags: [], sections: [{ label: "内容", quote: "" }] }) }).then(function(r) { return r.json(); });
  cards.push(c);
  renderPage(moduleId);
  updateStats();
}

  if (c.status === "draft") statusOpts += " selected";
  statusOpts += ">待验证</option>";
  
  document.getElementById("modalContent").innerHTML =     "<h3>编辑卡片</h3>" +     "<div class=\"field\"><label>标题</label><input id=\"cTitle\" value=\"" + c.title + "\"></div>" +     "<div class=\"field\"><label>副标题</label><input id=\"cSub\" value=\"" + (c.subtitle || "") + "\"></div>" +     "<div class=\"field\"><label>状态</label><select id=\"cStatus\">" + statusOpts + "</select></div>" +     "<div class=\"field\"><label>场景标签</label><input id=\"cScenes\" value=\"" + scenesStr + "\"></div>" +     "<div class=\"field\"><label>数据标签</label><input id=\"cTags\" value=\"" + tagsStr + "\"></div>" +     "<div class=\"field\"><label>内容段落</label><div id=\"sectionsWrap\">" + secHtml + "</div><span class=\"add-section\" onclick=\"addSection()\">+ 添加段落</span></div>" +     "<div class=\"modal-actions\"><div class=\"btn\" onclick=\"closeModal()\">取消</div><div class=\"btn danger\" onclick=\"deleteCard2(\'" + id + "\')\">删除卡片</div><div class=\"btn primary\" onclick=\"saveCard(\'" + id + "\')\">保存</div></div>";
}

function addSection() {
  var wrap = document.getElementById("sectionsWrap");
  var div = document.createElement("div");
  div.className = "section-item";
  div.innerHTML = "<input placeholder=\"段落标题\" class=\"sec-label\"><textarea placeholder=\"段落内容\" class=\"sec-quote\" rows=\"2\"></textarea><span class=\"rm\" onclick=\"this.parentElement.remove()\">✕</span>";
  wrap.appendChild(div);
}

async function saveCard(id) {
  var title = document.getElementById("cTitle").value.trim();
  if (!title) return;
  var secEls = document.querySelectorAll(".section-item");
  var sections = [];
  for (var i = 0; i < secEls.length; i++) {
    var label = secEls[i].querySelector(".sec-label").value || "";
    var quote = secEls[i].querySelector(".sec-quote").value || "";
    sections.push({ label: label, quote: quote });
  }
  var scenes = [];
  var scenesRaw = document.getElementById("cScenes").value;
  if (scenesRaw) {
    var parts = scenesRaw.split(",");
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (s) scenes.push(s);
    }
  }
  var tags = [];
  var tagsRaw = document.getElementById("cTags").value;
  if (tagsRaw) {
    var parts = tagsRaw.split(",");
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (s) tags.push(s);
    }
  }
  var body = {
    title: title,
    subtitle: document.getElementById("cSub").value,
    status: document.getElementById("cStatus").value,
    scenes: scenes,
    dataTags: tags,
    sections: sections
  };
  var updated = await fetch(API + "/cards/" + id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(function(r) { return r.json(); });
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].id === id) { cards[i] = updated; break; }
  }
  closeModal();
  renderPage(updated.moduleId);
}

async function deleteCard(id) {
  if (!confirm("确认删除？")) return;
  var modId = null;
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].id === id) { modId = cards[i].moduleId; break; }
  }
  await fetch(API + "/cards/" + id, { method: "DELETE" });
  var newCards = [];
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].id !== id) newCards.push(cards[i]);
  }
  cards = newCards;
  if (modId) renderPage(modId);
  updateStats();
}

function deleteCard2(id) { deleteCard(id); }
function closeModal() { document.getElementById("modalOverlay").classList.remove("show"); }

document.getElementById("sidebarToggle").addEventListener("click", function() {
  document.getElementById("sidebar").classList.toggle("collapsed");
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeModal();
});

function editResume() {
  var mod = null;
  for (var i = 0; i < modules.length; i++) {
    if (modules[i].id === "resume") { mod = modules[i]; break; }
  }
  if (!mod) return;
  var rd = mod.resumeData || {};
  document.getElementById("modalOverlay").classList.add("show");
  document.getElementById("modalContent").innerHTML =
    "<h3>编辑个人简历</h3>" +
    '<div class="field"><label>姓名</label><input id="resName" value="' + (rd.name||"") + '"></div>' +
    '<div class="field"><label>电话</label><input id="resPhone" value="' + (rd.phone||"") + '"></div>' +
    '<div class="field"><label>邮箱</label><input id="resEmail" value="' + (rd.email||"") + '"></div>' +
    '<div class="field"><label>年龄 / 地点</label><div style="display:flex;gap:8px"><input id="resAge" placeholder="年龄" value="' + (rd.age||"") + '" style="flex:1"><input id="resLoc" placeholder="地点" value="' + (rd.location||"") + '" style="flex:2"></div></div>' +
    '<div class="field"><label>求职意向</label><input id="resIntent" value="' + (rd.intent||"") + '"></div>' +
    '<div class="field"><label>教育背景</label><input id="resEdu" value="' + (rd.education||"") + '"></div>' +
    '<div class="field"><label>核心竞争力</label><textarea id="resCore" rows="2">' + (rd.core||"") + '</textarea></div>' +
    '<div class="modal-actions"><div class="btn" onclick="closeModal()">取消</div><div class="btn primary" onclick="saveResume()">保存</div></div>';
}

function saveResume() {
  var data = {
    resumeData: {
      name: document.getElementById("resName").value,
      phone: document.getElementById("resPhone").value,
      email: document.getElementById("resEmail").value,
      age: document.getElementById("resAge").value,
      location: document.getElementById("resLoc").value,
      intent: document.getElementById("resIntent").value,
      education: document.getElementById("resEdu").value,
      core: document.getElementById("resCore").value
    }
  };
  fetch(API + "/modules/resume", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
    .then(function(r) { return r.json(); })
    .then(function(updated) {
      for (var i = 0; i < modules.length; i++) {
        if (modules[i].id === "resume") { modules[i] = updated; break; }
      }
      closeModal();
      renderPage("resume");
    });
}
